<fieldset id="upstand-options" hidden disabled><legend><span>04</span> 물받이 턱(스테인레스 상판 주문시에만 적용)</legend>
<div class="form-grid">
<label>물받이 턱 유무<select id="upstand-presence" name="물받이 턱 유무"><option>상담 필요</option><option>있음</option><option>없음</option></select></label>
<label>도장 유무<select id="upstand-paint" name="물받이 턱 도장 유무" aria-describedby="upstand-help"><option>상담 필요</option><option value="도장 있음">도장 있음</option><option value="도장 없음">도장 없음</option></select></label>
<label>도장 종류<select id="upstand-paint-type" name="물받이 턱 도장 종류" disabled><option>우레탄도장</option><option>분체도장</option></select></label>
<label>도장 색상<select id="upstand-paint-color" name="물받이 턱 도장 색상" disabled><option value="상담 필요">상담 필요</option><option>매트블랙</option><option>샴페인 골드</option><option>소프트 브론즈</option></select></label>
</div><div id="paint-samples" class="paint-samples" hidden>
<p class="paint-samples-title">도장 색상 예시 <span>견본을 눌러 선택하세요.</span></p>
<div class="paint-samples-grid" role="group" aria-label="도장 색상 견본">
<button type="button" class="paint-sample" data-paint-color="매트블랙" aria-pressed="false"><span class="paint-swatch swatch-black" aria-hidden="true"></span><span>매트블랙</span><span class="sample-check" aria-hidden="true">✓</span></button>
<button type="button" class="paint-sample" data-paint-color="샴페인 골드" aria-pressed="false"><span class="paint-swatch swatch-gold" aria-hidden="true"></span><span>샴페인 골드</span><span class="sample-check" aria-hidden="true">✓</span></button>
<button type="button" class="paint-sample" data-paint-color="소프트 브론즈" aria-pressed="false"><span class="paint-swatch swatch-bronze" aria-hidden="true"></span><span>소프트 브론즈</span><span class="sample-check" aria-hidden="true">✓</span></button>
</div>
<p class="paint-samples-note">색상 이해를 돕는 화면 견본입니다. 실제 색상과 광택은 도장 방식·조명·화면 설정에 따라 달라질 수 있으며, 최종 색상은 실물 도장 샘플로 확인합니다.</p>
</div>
<p id="upstand-help" class="upstand-help" aria-live="polite">‘도장 있음’을 선택하면 도장 종류와 색상을 선택할 수 있습니다.</p>
</fieldset>
